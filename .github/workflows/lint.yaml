name: Lint

on:
  - push

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: set up JDK
        uses: actions/setup-java@v5.7.0
        with:
          distribution: zulu
          java-version: 21
          cache: gradle
      - run: ./gradlew spotlessCheck
